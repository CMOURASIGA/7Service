name: Temporary format activation resend
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/format-resend-invite-temp.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format updated invitation files
        run: |
          npx prettier --write "src/app/(admin)/usuarios/[id]/actions.ts" "src/app/(admin)/usuarios/[id]/page.tsx"
          git add "src/app/(admin)/usuarios/[id]/actions.ts" "src/app/(admin)/usuarios/[id]/page.tsx"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(invites): format activation resend"
            git push origin HEAD:develop
          fi
