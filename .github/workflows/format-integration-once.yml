name: One-time 7Service integration formatting
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/format-integration-once.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format and verify full tree
        run: |
          npm run format
          npm run format:check
      - name: Remove temporary formatter and commit
        run: |
          rm .github/workflows/format-integration-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: normalize central access integration for CI"
          git push origin HEAD:develop
