name: Temporary format revocation changes
on:
  push:
    branches:
      - fix/revocation-format-ci-20261118
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/revocation-format-ci-20261118
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: |
          npx prettier --write \
            'src/lib/integrations/commander-revocation.ts' \
            'src/app/(admin)/usuarios/[id]/page.tsx' \
            'tests/revocation-sync-ux.test.mjs'
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            'src/lib/integrations/commander-revocation.ts' \
            'src/app/(admin)/usuarios/[id]/page.tsx' \
            'tests/revocation-sync-ux.test.mjs'
          git diff --cached --quiet || { git commit -m "style: format revocation sync and status UX"; git push; }
