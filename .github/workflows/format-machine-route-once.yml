name: One-time M2M test formatting develop
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/format-machine-route-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Normalize M2M unit test
        run: |
          npx prettier --write src/lib/auth/machine-route.test.ts
          npm run format:check
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/format-machine-route-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/format-machine-route-once.yml src/lib/auth/machine-route.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: normalize machine entitlement route tests"
          git push origin HEAD:develop
