name: One-time HV-01C regression formatting
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/format-hv01c-regression-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format test with repository Prettier
        run: |
          npx prettier --write src/lib/supabase/middleware.test.ts
          npm run format:check
      - name: Self-remove and commit only formatted test
        run: |
          rm .github/workflows/format-hv01c-regression-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/format-hv01c-regression-once.yml src/lib/supabase/middleware.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: normalize HV-01C middleware regression tests"
          git fetch origin develop
          git rebase origin/develop
          git push origin HEAD:develop
