name: Temporary SSO format
on:
  push:
    branches:
      - feat/portal-commander-sso-launch-20261118
    paths:
      - .github/workflows/temporary-sso-formatter.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/portal-commander-sso-launch-20261118
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: |
          npx prettier --write \
            'src/app/meus-sistemas/page.tsx' \
            'src/features/portal/components/commander-launch-button.tsx' \
            'tests/portal-commander-sso.test.mjs'
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            'src/app/meus-sistemas/page.tsx' \
            'src/features/portal/components/commander-launch-button.tsx' \
            'tests/portal-commander-sso.test.mjs'
          git diff --cached --quiet || { git commit -m "style: format portal SSO changes"; git push; }
