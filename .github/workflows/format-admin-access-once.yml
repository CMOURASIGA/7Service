name: One-time administrative access formatting
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/format-admin-access-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format updated access files
        run: |
          npx prettier --write src/app/api/auth/internal-access/route.ts src/app/'(admin)'/layout.tsx src/features/auth/components/restricted-access.tsx src/features/auth/components/login-form.tsx src/lib/auth/safe-admin-redirect.ts src/lib/auth/safe-admin-redirect.test.ts
          npm run format:check
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/format-admin-access-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: normalize admin access denial and redirect safeguards"
          git push origin HEAD:develop
