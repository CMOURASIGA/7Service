name: Dependency security patch
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/security-dependency-fix-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply compatible vulnerability patches
        run: npm audit fix --omit=dev || test "$?" -eq 1
      - name: Commit changes only if lockfile changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: compatible dependency patches [skip ci]"
            git fetch origin develop
            git rebase origin/develop
            git push origin HEAD:develop
          fi
