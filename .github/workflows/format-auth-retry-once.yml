name: One-time auth formatting retry
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/format-auth-retry-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format and check
        run: |
          npx prettier --write src/app/api/auth/internal-access/route.ts src/app/api/auth/internal-access/route.test.ts src/app/api/auth/logout/route.ts src/app/api/auth/logout/route.test.ts src/components/layout/logout-button.tsx src/components/layout/topbar.tsx src/features/auth/components/restricted-access.tsx src/lib/auth/internal-access-status.ts src/lib/auth/internal-access-status.test.ts
          npm run format:check
      - name: Remove temporary workflows and push formatting safely
        run: |
          rm -f .github/workflows/format-auth-final-once.yml .github/workflows/format-auth-retry-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then git commit -m "style: normalize HV-01 access/logout tests"; fi
          git fetch origin develop
          git rebase origin/develop
          git push origin HEAD:develop
