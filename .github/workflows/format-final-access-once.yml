name: One-time access release formatting
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/format-final-access-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Normalize and verify formatting
        run: |
          npm run format
          npm run format:check
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/format-final-access-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: normalize final access and entitlement changes"
          git push origin HEAD:develop
