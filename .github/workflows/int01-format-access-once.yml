name: Format access management feature once
on:
  push:
    branches: [develop]
    paths: [.github/workflows/int01-format-access-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm exec -- prettier --write 'src/app/(admin)/acessos/page.tsx' 'src/app/(admin)/ajuda/page.tsx'
      - name: Save formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/(admin)/acessos/page.tsx' 'src/app/(admin)/ajuda/page.tsx'
          if ! git diff --cached --quiet; then
            git commit -m "style(access): format central access management UI"
            git push origin HEAD:develop
          fi
