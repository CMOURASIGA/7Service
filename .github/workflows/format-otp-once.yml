name: One-time OTP form formatting develop
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/format-otp-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Normalize only OTP UI formatting
        run: |
          npx prettier --write src/features/auth/components/forgot-password-form.tsx src/features/auth/components/set-password-form.tsx
          npm run format:check
      - name: Remove one-time workflow and commit formatting
        run: |
          rm .github/workflows/format-otp-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/format-otp-once.yml src/features/auth/components/forgot-password-form.tsx src/features/auth/components/set-password-form.tsx
          git diff --cached --quiet && exit 0
          git commit -m "style: normalize OTP recovery forms"
          git push origin HEAD:develop
