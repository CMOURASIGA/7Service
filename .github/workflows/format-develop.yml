name: Apply formatting to develop
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/format-develop.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatted files to develop
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -u
          git add src .github
          if ! git diff --cached --quiet; then
            git commit -m "style: apply required Prettier formatting [skip ci]"
            git push origin HEAD:develop
          fi
