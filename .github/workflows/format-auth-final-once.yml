name: One-time auth hardening formatting
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/format-auth-final-once.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply repository formatter
        run: |
          npx prettier --write src/app/api/auth/internal-access/route.ts src/app/api/auth/internal-access/route.test.ts src/app/api/auth/logout/route.ts src/app/api/auth/logout/route.test.ts src/components/layout/logout-button.tsx src/components/layout/topbar.tsx src/features/auth/components/restricted-access.tsx src/lib/auth/internal-access-status.ts src/lib/auth/internal-access-status.test.ts
          npm run format:check
      - name: Remove formatter workflow and commit
        run: |
          rm .github/workflows/format-auth-final-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: normalize HV-01 administrative logout and access tests"
          git push origin HEAD:develop
