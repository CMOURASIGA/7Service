name: Normalize revocation final once
on:
  push:
    branches: [develop]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Normalize two UI and action files and remove this workflow
        run: |
          npx prettier --write "src/app/(admin)/usuarios/[id]/page.tsx" "src/app/(admin)/usuarios/[id]/memberships/actions.ts"
          git rm .github/workflows/format-revocation-final-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "src/app/(admin)/usuarios/[id]/page.tsx" "src/app/(admin)/usuarios/[id]/memberships/actions.ts"
          git commit -m "style: normalize final revocation UI and retry flow" || exit 0
          git push
