name: Format Vercel proof once
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/format-vercel-proof-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: develop}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx prettier --write 'src/app/(admin)/ambientes/verify-vercel-actions.ts' 'src/lib/deployments/vercel-evidence.ts' 'src/lib/deployments/vercel-evidence.test.ts'
      - name: Commit formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/(admin)/ambientes/verify-vercel-actions.ts' 'src/lib/deployments/vercel-evidence.ts' 'src/lib/deployments/vercel-evidence.test.ts'
          if ! git diff --cached --quiet; then
            git commit -m "style: format Vercel evidence proof"
            git restore .github/workflows/format-vercel-proof-once.yml
            git fetch origin develop
            git rebase origin/develop
            git push origin HEAD:develop
          fi
