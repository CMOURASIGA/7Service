name: Format date validation once
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/format-iso-date-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: develop}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx prettier --write 'src/app/(admin)/clientes/actions.ts' src/lib/validation/iso-date.ts src/lib/validation/iso-date.test.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/(admin)/clientes/actions.ts' src/lib/validation/iso-date.ts src/lib/validation/iso-date.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format ISO date validation"
            git restore .github/workflows/format-iso-date-once.yml
            git fetch origin develop
            git rebase origin/develop
            git push origin HEAD:develop
          fi
