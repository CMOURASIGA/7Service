name: One-time QA DB test formatting
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/format-qa-db-once.yml
permissions:
  contents: write
jobs:
  format-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Normalize QA test formatting
        run: |
          npm run format
          npm run format:check
          git diff --check
          git diff --stat
      - name: Commit formatted QA tests and remove temporary workflow
        run: |
          rm .github/workflows/format-qa-db-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(qa-db): normalize integration test formatting"
          git push origin HEAD:develop
